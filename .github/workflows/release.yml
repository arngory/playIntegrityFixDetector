name: Release

# Pushing a tag such as v3.1 builds a signed APK for every ABI plus a universal one and
# publishes them as a GitHub release. Running the workflow by hand from the Actions tab
# builds the same APKs as a workflow artifact and publishes nothing, which is the way to
# check the signing secrets before cutting a real release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # An unsigned release APK cannot be installed, so refuse to build one rather than
          # publish something nobody can use.
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See the Releases section of README.md."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore"

          # The APK signature check compares the signing certificate against a digest compiled
          # into the native engine. Taking that digest from the keystore that signs means the
          # two cannot drift, so a release never reports its own signature as tampered.
          keytool -exportcert -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/release.cer"
          cert_sha256=$(sha256sum "$RUNNER_TEMP/release.cer" | cut -d' ' -f1)
          echo "Signing certificate SHA-256: $cert_sha256"

          echo "RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signatures and collect APKs
        run: |
          out=app/build/outputs/apk/release
          metadata="$out/output-metadata.json"
          version_name=$(jq -r '.elements[0].versionName' "$metadata")

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name. Bump versionName and versionCode in app/build.gradle.kts, or tag v$version_name."
              exit 1
            fi
            label="$GITHUB_REF_NAME"
          else
            label="v$version_name-${GITHUB_SHA::7}"
          fi

          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          mkdir -p dist
          count=0
          while IFS=$'\t' read -r file abi; do
            digest=$("$apksigner" verify --print-certs "$out/$file" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$digest" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::$file is signed with '$digest', expected '$RELEASE_CERT_SHA256'."
              exit 1
            fi
            cp "$out/$file" "dist/PIF-Detector-$label-$abi.apk"
            count=$((count + 1))
          done < <(jq -r '.elements[]
            | [.outputFile, ((.filters[] | select(.filterType == "ABI") | .value) // "universal")]
            | @tsv' "$metadata")

          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs listed in $metadata."
            exit 1
          fi

          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: apks
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: apks
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release drafted in the GitHub UI creates the tag itself, so it may already exist
          # by the time this runs. Attach the APKs to it instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--title "$TAG" --generate-notes --verify-tag)
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
